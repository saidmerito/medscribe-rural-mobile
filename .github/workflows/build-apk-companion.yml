name: Build APK (Companion)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'MedScribeRuralCompanion/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MedScribeRuralCompanion
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MedScribeRuralCompanion-debug
          path: MedScribeRuralCompanion/app/build/outputs/apk/debug/*.apk
