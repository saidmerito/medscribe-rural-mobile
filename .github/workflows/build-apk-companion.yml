name: Build APK (Companion)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'MedScribeRuralCompanion/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MedScribeRuralCompanion
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: gradle assembleDebug --stacktrace 2>&1 | tee build-output.log

      - name: Save failure log to repo (auto-diagnostic)
        if: steps.build.outcome == 'failure'
        run: |
          mkdir -p ../ci-logs
          {
            echo "# Echec build Companion - $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            tail -n 300 build-output.log
            echo '```'
          } > ../ci-logs/companion-last-failure.md
          cd ..
          git config user.email "ci@medscriberural.local"
          git config user.name "CI Bot"
          git add ci-logs/companion-last-failure.md
          git commit -m "CI: echec build Companion (auto-diagnostic)" || echo "rien a committer"
          git pull --rebase origin main || true
          git push origin HEAD:main || true

      - name: Marquer le job en echec si le build a echoue
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MedScribeRuralCompanion-debug
          path: MedScribeRuralCompanion/app/build/outputs/apk/debug/*.apk
