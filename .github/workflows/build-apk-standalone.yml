name: Build APK (Standalone)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'MedScribeRuralStandalone/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MedScribeRuralStandalone
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MedScribeRuralStandalone-debug
          path: MedScribeRuralStandalone/app/build/outputs/apk/debug/*.apk
